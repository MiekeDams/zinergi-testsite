<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#243028"><title>Zinergi · Account</title>
<style>
:root{--bg:#f4efe5;--surface:#fffdf8;--ink:#263029;--muted:#6f786f;--green:#2c3a31;--line:#ddd5c6;--gold:#b88e58;--danger:#9f4f44}*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink)}.wrap{max-width:560px;margin:auto;min-height:100vh;padding:calc(28px + env(safe-area-inset-top)) 20px 40px}.brand{font-family:Georgia,serif;letter-spacing:.18em;font-size:20px;display:flex;align-items:center;gap:10px}.mark{width:42px;height:42px;border:1px solid var(--green);border-radius:50%;display:grid;place-items:center}.hero{margin:42px 0 24px}.eyebrow{text-transform:uppercase;letter-spacing:.16em;font-size:12px;color:var(--muted)}h1{font:400 48px/1.02 Georgia,serif;margin:10px 0 12px}p{color:var(--muted);line-height:1.55}.card{background:var(--surface);border:1px solid var(--line);border-radius:24px;padding:20px}.tabs{display:grid;grid-template-columns:1fr 1fr;background:#ebe5d9;border-radius:14px;padding:4px;margin-bottom:18px}.tabs button{border:0;background:transparent;padding:11px;border-radius:11px;font-weight:600;color:var(--muted)}.tabs button.active{background:var(--surface);color:var(--ink);box-shadow:0 2px 10px rgba(0,0,0,.06)}label{display:block;font-size:13px;margin:14px 0 6px}.field{width:100%;padding:14px 15px;border:1px solid var(--line);border-radius:14px;background:white;font-size:16px;color:var(--ink)}.primary{width:100%;margin-top:18px;border:0;border-radius:14px;background:var(--green);color:white;padding:15px;font-size:16px;font-weight:700}.secondary{width:100%;margin-top:10px;border:1px solid var(--line);border-radius:14px;background:var(--surface);padding:14px;font-size:15px}.linkbtn{border:0;background:transparent;color:var(--green);padding:8px 0;text-decoration:underline;font-size:13px}.error{font-size:13px;color:var(--danger);min-height:18px;margin-top:8px}.lang{display:flex;gap:6px;justify-content:flex-end;margin-bottom:10px}.lang button{border:1px solid var(--line);background:var(--surface);padding:7px 9px;border-radius:999px}.lang .active{background:var(--green);color:white}.hidden{display:none}.notice{margin-top:18px;padding:12px;border:1px solid var(--line);border-radius:14px;font-size:12px;color:var(--muted)}.mode{display:inline-block;margin-top:8px;padding:5px 8px;border-radius:999px;background:#eee7da;font-size:11px;color:var(--muted)}
</style>
<link rel="stylesheet" href="/assets/zinergi-japandi-symbols.css"></head><body><div class="wrap"><div class="lang"><button data-lang="nl">NL</button><button data-lang="en">EN</button><button data-lang="id">ID</button></div><div class="brand"><div class="mark">Z</div>ZINERGI</div><div class="hero"><div class="eyebrow" data-t="eyebrow">Account</div><h1 data-t="title">Welkom bij Zinergi.</h1><p data-t="intro">Log in of maak je persoonlijke account aan.</p><span class="mode" id="modeBadge">Demo mode</span></div><div class="card"><div class="tabs"><button id="tabLogin" class="active" data-t="login">Inloggen</button><button id="tabRegister" data-t="register">Account maken</button></div><form id="loginForm"><label data-t="email">E-mailadres</label><input id="loginEmail" class="field" type="email" autocomplete="email" required><label data-t="password">Wachtwoord</label><input id="loginPassword" class="field" type="password" autocomplete="current-password" required minlength="6"><div id="loginError" class="error"></div><button class="primary" type="submit" data-t="loginBtn">Inloggen</button><button class="linkbtn" type="button" id="forgotBtn" data-t="forgot">Wachtwoord vergeten?</button><button class="secondary" type="button" id="demoBtn" data-t="demoBtn">Gebruik demo-account</button></form><form id="registerForm" class="hidden"><label data-t="name">Voornaam</label><input id="regName" class="field" required><label data-t="email">E-mailadres</label><input id="regEmail" class="field" type="email" required><label data-t="password">Wachtwoord</label><input id="regPassword" class="field" type="password" required minlength="8"><div id="regError" class="error"></div><button class="primary" type="submit" data-t="createBtn">Account maken & starten</button></form><div class="notice" id="notice" data-t="notice">Zinergi gebruikt beveiligde accountopslag zodra de productie-backend is geconfigureerd. Tot die tijd blijft de demo-modus actief.</div></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/assets/zinergi-config.js" onerror="this.remove()"></script>
<script src="/assets/zinergi-data-v01.js"></script>
<script src="/assets/zinergi-supabase-adapter-v01.js"></script>
<script>
const C={nl:{eyebrow:'Account',title:'Welkom bij Zinergi.',intro:'Log in of maak je persoonlijke account aan.',login:'Inloggen',register:'Account maken',email:'E-mailadres',password:'Wachtwoord',name:'Voornaam',loginBtn:'Inloggen',demoBtn:'Gebruik demo-account',createBtn:'Account maken & starten',forgot:'Wachtwoord vergeten?',notice:'Zinergi gebruikt beveiligde accountopslag zodra de productie-backend is geconfigureerd. Tot die tijd blijft de demo-modus actief.',bad:'Inloggen is niet gelukt. Controleer je gegevens.',exists:'Dit e-mailadres is al in gebruik.',sent:'Controleer je e-mail voor de resetlink.',created:'Account aangemaakt. Controleer eventueel je e-mail ter bevestiging.',remote:'Beveiligde accountmodus',demo:'Demo-modus'},en:{eyebrow:'Account',title:'Welcome to Zinergi.',intro:'Sign in or create your personal account.',login:'Sign in',register:'Create account',email:'Email address',password:'Password',name:'First name',loginBtn:'Sign in',demoBtn:'Use demo account',createBtn:'Create account & start',forgot:'Forgot password?',notice:'Zinergi uses secure account storage once the production backend is configured. Until then demo mode remains available.',bad:'Sign in failed. Check your details.',exists:'This email address is already in use.',sent:'Check your email for the reset link.',created:'Account created. Check your email if confirmation is required.',remote:'Secure account mode',demo:'Demo mode'},id:{eyebrow:'Akun',title:'Selamat datang di Zinergi.',intro:'Masuk atau buat akun pribadi Anda.',login:'Masuk',register:'Buat akun',email:'Alamat email',password:'Kata sandi',name:'Nama depan',loginBtn:'Masuk',demoBtn:'Gunakan akun demo',createBtn:'Buat akun & mulai',forgot:'Lupa kata sandi?',notice:'Zinergi menggunakan penyimpanan akun yang aman setelah backend produksi dikonfigurasi. Sampai saat itu mode demo tetap tersedia.',bad:'Gagal masuk. Periksa data Anda.',exists:'Alamat email ini sudah digunakan.',sent:'Periksa email Anda untuk tautan reset.',created:'Akun dibuat. Periksa email jika konfirmasi diperlukan.',remote:'Mode akun aman',demo:'Mode demo'}};
let lang=localStorage.getItem('zinergi-language')||localStorage.getItem('zinergi-lang')||'nl';function t(k){return C[lang]?.[k]||C.nl[k]||k}function setLang(l){lang=l;localStorage.setItem('zinergi-language',l);document.documentElement.lang=l;document.querySelectorAll('[data-t]').forEach(e=>e.textContent=C[l]?.[e.dataset.t]||e.textContent);document.querySelectorAll('[data-lang]').forEach(b=>b.classList.toggle('active',b.dataset.lang===l))}document.querySelectorAll('[data-lang]').forEach(b=>b.onclick=()=>setLang(b.dataset.lang));setLang(lang);
const L=loginForm,R=registerForm,a=tabLogin,b=tabRegister;a.onclick=()=>{a.classList.add('active');b.classList.remove('active');L.classList.remove('hidden');R.classList.add('hidden')};b.onclick=()=>{b.classList.add('active');a.classList.remove('active');R.classList.remove('hidden');L.classList.add('hidden')};
function getUsers(){try{return JSON.parse(localStorage.getItem('zinergi-users')||'[]')}catch{return[]}}function saveDemoSession(u){localStorage.setItem('zinergi-session',JSON.stringify({email:u.email,name:u.name||'Gebruiker',ts:Date.now(),mode:'demo'}))}
let remote=false;(async()=>{try{const r=await window.ZinergiBackend.init();remote=r.mode==='remote';modeBadge.textContent=t(remote?'remote':'demo');if(remote&&r.authenticated){const p=await window.ZinergiData.get('profile',{});localStorage.setItem('zinergi-session',JSON.stringify({email:r.user.email,name:p?.display_name||r.user.user_metadata?.name||'Gebruiker',ts:Date.now(),mode:'remote',userId:r.user.id}));}}catch(e){console.warn('Backend init failed; demo remains active',e);remote=false;modeBadge.textContent=t('demo')}})();
R.onsubmit=async e=>{e.preventDefault();regError.textContent='';const email=regEmail.value.trim().toLowerCase(),name=regName.value.trim(),password=regPassword.value;if(remote){try{const result=await window.ZinergiBackend.signUp(email,password,{name,language:lang});if(result.user){localStorage.setItem('zinergi-session',JSON.stringify({email,name,ts:Date.now(),mode:'remote',userId:result.user.id}));regError.style.color='var(--green)';regError.textContent=t('created');setTimeout(()=>location.href='/sprint2/onboarding/',700)}return}catch(err){regError.style.color='var(--danger)';regError.textContent=err?.message||t('exists');return}}let users=getUsers();if(users.some(u=>u.email===email)){regError.textContent=t('exists');return}const u={name,email,password};users.push(u);localStorage.setItem('zinergi-users',JSON.stringify(users));saveDemoSession(u);location.href='/sprint2/onboarding/'};
L.onsubmit=async e=>{e.preventDefault();loginError.textContent='';const email=loginEmail.value.trim().toLowerCase(),password=loginPassword.value;if(remote){try{const result=await window.ZinergiBackend.signIn(email,password);const p=await window.ZinergiData.get('profile',{});localStorage.setItem('zinergi-session',JSON.stringify({email,name:p?.display_name||result.user.user_metadata?.name||'Gebruiker',ts:Date.now(),mode:'remote',userId:result.user.id}));location.href='/alpha/';return}catch(err){loginError.textContent=t('bad');return}}const users=getUsers(),u=users.find(x=>x.email===email&&x.password===password);if(!u){loginError.textContent=t('bad');return}saveDemoSession(u);location.href='/alpha/'};
forgotBtn.onclick=async()=>{const email=loginEmail.value.trim().toLowerCase();if(!email){loginError.textContent=t('bad');return}if(!remote){loginError.textContent=t('notice');return}try{await window.ZinergiBackend.resetPassword(email);loginError.style.color='var(--green)';loginError.textContent=t('sent')}catch(e){loginError.style.color='var(--danger)';loginError.textContent=e?.message||t('bad')}};
demoBtn.onclick=()=>{const u={name:'Mieke',email:'demo@zinergi.nl',password:'demo123'};let users=getUsers();if(!users.some(x=>x.email===u.email)){users.push(u);localStorage.setItem('zinergi-users',JSON.stringify(users))}saveDemoSession(u);location.href='/alpha/'};
</script><script src="/assets/zinergi-japandi-symbols.js"></script></body></html>
