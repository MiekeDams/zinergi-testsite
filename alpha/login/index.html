<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#243028"><title>Zinergi · Account</title>
<style>
:root{--bg:#f4efe5;--surface:#fffdf8;--ink:#263029;--muted:#6f786f;--green:#2c3a31;--line:#ddd5c6;--gold:#b88e58;--danger:#9f4f44}*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink)}.wrap{max-width:560px;margin:auto;min-height:100vh;padding:calc(28px + env(safe-area-inset-top)) 20px 40px}.brand{font-family:Georgia,serif;letter-spacing:.18em;font-size:20px;display:flex;align-items:center;gap:10px}.mark{width:42px;height:42px;border:1px solid var(--green);border-radius:50%;display:grid;place-items:center}.hero{margin:42px 0 24px}.eyebrow{text-transform:uppercase;letter-spacing:.16em;font-size:12px;color:var(--muted)}h1{font:400 48px/1.02 Georgia,serif;margin:10px 0 12px}p{color:var(--muted);line-height:1.55}.card{background:var(--surface);border:1px solid var(--line);border-radius:24px;padding:20px}.tabs{display:grid;grid-template-columns:1fr 1fr;background:#ebe5d9;border-radius:14px;padding:4px;margin-bottom:18px}.tabs button{border:0;background:transparent;padding:11px;border-radius:11px;font-weight:600;color:var(--muted)}.tabs button.active{background:var(--surface);color:var(--ink);box-shadow:0 2px 10px rgba(0,0,0,.06)}label{display:block;font-size:13px;margin:14px 0 6px}.field{width:100%;padding:14px 15px;border:1px solid var(--line);border-radius:14px;background:white;font-size:16px;color:var(--ink)}.primary{width:100%;margin-top:18px;border:0;border-radius:14px;background:var(--green);color:white;padding:15px;font-size:16px;font-weight:700}.secondary{width:100%;margin-top:10px;border:1px solid var(--line);border-radius:14px;background:var(--surface);padding:14px;font-size:15px}.hint{font-size:12px;margin-top:12px}.error{font-size:13px;color:var(--danger);min-height:18px;margin-top:8px}.lang{display:flex;gap:6px;justify-content:flex-end;margin-bottom:10px}.lang button{border:1px solid var(--line);background:var(--surface);padding:7px 9px;border-radius:999px}.lang .active{background:var(--green);color:white}.hidden{display:none}.notice{margin-top:18px;padding:12px;border:1px solid var(--line);border-radius:14px;font-size:12px;color:var(--muted)}
</style>
<link rel="stylesheet" href="/assets/zinergi-japandi-symbols.css"></head><body><div class="wrap"><div class="lang"><button data-lang="nl">NL</button><button data-lang="en">EN</button><button data-lang="id">ID</button></div><div class="brand"><div class="mark">Z</div>ZINERGI</div><div class="hero"><div class="eyebrow" data-t="eyebrow">Alpha 0.1 · account</div><h1 data-t="title">Welkom bij Zinergi.</h1><p data-t="intro">Maak een testaccount aan of log in om de onboarding te doorlopen.</p></div><div class="card"><div class="tabs"><button id="tabLogin" class="active" data-t="login">Inloggen</button><button id="tabRegister" data-t="register">Account maken</button></div><form id="loginForm"><label data-t="email">E-mailadres</label><input id="loginEmail" class="field" type="email" autocomplete="email" required><label data-t="password">Wachtwoord</label><input id="loginPassword" class="field" type="password" autocomplete="current-password" required minlength="6"><div id="loginError" class="error"></div><button class="primary" type="submit" data-t="loginBtn">Inloggen</button><button class="secondary" type="button" id="demoBtn" data-t="demoBtn">Gebruik demo-account</button></form><form id="registerForm" class="hidden"><label data-t="name">Voornaam</label><input id="regName" class="field" required><label data-t="email">E-mailadres</label><input id="regEmail" class="field" type="email" required><label data-t="password">Wachtwoord</label><input id="regPassword" class="field" type="password" required minlength="6"><div id="regError" class="error"></div><button class="primary" type="submit" data-t="createBtn">Account maken & starten</button></form><div class="notice" data-t="notice">Testversie: accountgegevens worden alleen lokaal op dit apparaat opgeslagen. De beveiligde databasekoppeling volgt later.</div></div></div>
<script>
const C={nl:{eyebrow:'Alpha 0.1 · account',title:'Welkom bij Zinergi.',intro:'Maak een testaccount aan of log in om de onboarding te doorlopen.',login:'Inloggen',register:'Account maken',email:'E-mailadres',password:'Wachtwoord',name:'Voornaam',loginBtn:'Inloggen',demoBtn:'Gebruik demo-account',createBtn:'Account maken & starten',notice:'Testversie: accountgegevens worden alleen lokaal op dit apparaat opgeslagen. De beveiligde databasekoppeling volgt later.',bad:'Controleer e-mailadres en wachtwoord.',exists:'Er bestaat al een testaccount met dit e-mailadres.'},en:{eyebrow:'Alpha 0.1 · account',title:'Welcome to Zinergi.',intro:'Create a test account or sign in to start onboarding.',login:'Sign in',register:'Create account',email:'Email address',password:'Password',name:'First name',loginBtn:'Sign in',demoBtn:'Use demo account',createBtn:'Create account & start',notice:'Test version: account data is stored locally on this device only. Secure database integration comes later.',bad:'Check your email and password.',exists:'A test account with this email already exists.'},id:{eyebrow:'Alpha 0.1 · akun',title:'Selamat datang di Zinergi.',intro:'Buat akun uji atau masuk untuk memulai onboarding.',login:'Masuk',register:'Buat akun',email:'Alamat email',password:'Kata sandi',name:'Nama depan',loginBtn:'Masuk',demoBtn:'Gunakan akun demo',createBtn:'Buat akun & mulai',notice:'Versi uji: data akun hanya disimpan secara lokal di perangkat ini. Integrasi database aman akan menyusul.',bad:'Periksa email dan kata sandi.',exists:'Akun uji dengan email ini sudah ada.'}};
let lang=localStorage.getItem('zinergi-lang')||'nl';function t(k){return C[lang][k]||k}function setLang(l){lang=l;localStorage.setItem('zinergi-lang',l);document.documentElement.lang=l;document.querySelectorAll('[data-t]').forEach(e=>e.textContent=C[l][e.dataset.t]||e.textContent);document.querySelectorAll('[data-lang]').forEach(b=>b.classList.toggle('active',b.dataset.lang===l))}document.querySelectorAll('[data-lang]').forEach(b=>b.onclick=()=>setLang(b.dataset.lang));setLang(lang);
const L=document.getElementById('loginForm'),R=document.getElementById('registerForm'),a=document.getElementById('tabLogin'),b=document.getElementById('tabRegister');a.onclick=()=>{a.classList.add('active');b.classList.remove('active');L.classList.remove('hidden');R.classList.add('hidden')};b.onclick=()=>{b.classList.add('active');a.classList.remove('active');R.classList.remove('hidden');L.classList.add('hidden')};
function getUsers(){try{return JSON.parse(localStorage.getItem('zinergi-users')||'[]')}catch{return[]}}function saveSession(u){localStorage.setItem('zinergi-session',JSON.stringify({email:u.email,name:u.name||'Gebruiker',ts:Date.now()}))}
R.onsubmit=e=>{e.preventDefault();let users=getUsers(),email=regEmail.value.trim().toLowerCase();if(users.some(u=>u.email===email)){regError.textContent=t('exists');return}let u={name:regName.value.trim(),email,password:regPassword.value};users.push(u);localStorage.setItem('zinergi-users',JSON.stringify(users));saveSession(u);location.href='/alpha/onboarding/'};
L.onsubmit=e=>{e.preventDefault();let users=getUsers(),email=loginEmail.value.trim().toLowerCase(),u=users.find(x=>x.email===email&&x.password===loginPassword.value);if(!u){loginError.textContent=t('bad');return}saveSession(u);location.href=localStorage.getItem('zinergi-onboarding-complete')==='1'?'/alpha/':'/alpha/onboarding/'};
demoBtn.onclick=()=>{let u={name:'Mieke',email:'demo@zinergi.nl',password:'demo123'};let users=getUsers();if(!users.some(x=>x.email===u.email)){users.push(u);localStorage.setItem('zinergi-users',JSON.stringify(users))}saveSession(u);location.href='/alpha/onboarding/'};
</script><script src="/assets/zinergi-japandi-symbols.js"></script></body></html>
