<!doctype html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Zinergi Evaluatie v0.1</title><link rel="stylesheet" href="/assets/zinergi-japandi-symbols.css"><style>:root{--f:#173a2a;--g:#b48935;--m:#70776f;--l:#dfd3c0;--bg:#f8f3e9}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--f)}.app{max-width:980px;margin:auto;padding:20px 18px 100px}.top{display:flex;justify-content:space-between;align-items:center}.brand{font:20px Georgia;letter-spacing:3px}.top a{color:var(--f);text-decoration:none}.hero{padding:35px 0}.tag{font-size:9px;text-transform:uppercase;letter-spacing:1.3px;color:var(--g)}h1,h2,h3{font-family:Georgia;font-weight:400}.hero h1{font-size:42px;margin:7px 0}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:11px}.card{background:#fffdf8;border:1px solid var(--l);border-radius:18px;padding:18px}.metric strong{display:block;font:28px Georgia}.metric small{color:var(--m)}.field{margin:15px 0}.field label{display:block;font-size:10px;text-transform:uppercase;color:var(--g);margin-bottom:6px}.field select,.field textarea,.field input{width:100%;padding:12px;border:1px solid var(--l);border-radius:10px;background:#fff}.field textarea{min-height:90px}.btn{border:0;background:var(--f);color:#fff;padding:12px 15px;border-radius:11px;font-weight:700;cursor:pointer}.secondary{background:#fff;color:var(--f);border:1px solid var(--l)}.actions{display:flex;gap:8px;flex-wrap:wrap}.history{margin-top:12px}.history article{border-top:1px solid var(--l);padding:12px 0}.status{display:inline-block;padding:6px 9px;border-radius:99px;background:#eee5d7;font-size:10px;color:var(--g)}@media(max-width:700px){.grid{grid-template-columns:1fr}.hero h1{font-size:35px}}</style></head><body><div class="app"><header class="top"><div class="brand">ZINERGI</div><a href="/sprint2/zorgpad/">Zorgpad</a></header><section class="hero"><span class="tag">Evaluatie & fase-overgang · v0.1</span><h1 id="hello">Tijd om te evalueren.</h1><p>Bekijk samen met je coach wat veranderd is, wat aandacht vraagt en welke volgende fase passend is.</p></section><section class="grid"><div class="card metric"><small>Health Score</small><strong id="score">—</strong></div><div class="card metric"><small>Zorgpad</small><strong id="path">—</strong></div><div class="card metric"><small>Voortgang</small><strong id="progress">—</strong></div></section><h2>Evaluatiemoment</h2><section class="card"><div class="field"><label>Evaluatieperiode</label><select id="period"><option value="4">4 weken</option><option value="6">6 weken</option><option value="12">12 weken</option></select></div><div class="field"><label>Hoe ervaar je je voortgang?</label><select id="feeling"><option value="better">Duidelijk verbeterd</option><option value="some">Enige verbetering</option><option value="same">Ongeveer gelijk</option><option value="worse">Achteruitgegaan</option></select></div><div class="field"><label>Wat gaat goed?</label><textarea id="wins" placeholder="Bijvoorbeeld energie, slaap, voeding, training, darmcomfort..."></textarea></div><div class="field"><label>Wat vraagt nog aandacht?</label><textarea id="attention"></textarea></div><div class="field"><label>Volgende stap</label><select id="decision"><option value="continue">Doorgaan in huidige fase</option><option value="next">Naar volgende fase</option><option value="adjust">Plan eerst aanpassen</option><option value="coach">Eerst bespreken met coach</option></select></div><div class="actions"><button class="btn" id="save">Evaluatie opslaan</button><a class="btn secondary" href="/sprint2/coach/">Bespreek met Coach</a></div></section><h2>Eerdere evaluaties</h2><section class="card history" id="history"></section></div><script src="/assets/zinergi-platform.js"></script><script>const P=window.ZinergiPlatform,session=P.read('zinergi-session',{}),profile=P.read('zinergi-profile-v02',{}),cp=P.read('zinergi-carepath-v01',{}),snap=P.snapshot();if(!session?.name)location.replace('/alpha/login/');const names={gut:'Darmherstel',hormones:'Menopauze & Hormonen',muscle:'Spieropbouw 40+',energy:'Energie & Herstel',recovery:'Energie & Herstel',custom:'Persoonlijk traject',personal:'Persoonlijk traject'};hello.textContent='Tijd om te evalueren'+(session.name?' · '+session.name:'')+'.';score.textContent=snap.total==null?'—':snap.total+'/100';path.textContent=names[cp.path]||cp.path||'—';const done=Array.isArray(cp.done)?cp.done:[];progress.textContent=done.length?Math.round(done.filter(Boolean).length/done.length*100)+'%':'—';function renderHistory(){const h=P.read('zinergi-evaluations-v01',[]);history.innerHTML=h.length?h.slice().reverse().map(e=>`<article><span class="status">${e.period} weken · ${new Date(e.createdAt).toLocaleDateString()}</span><h3>${e.decision==='next'?'Volgende fase':e.decision==='adjust'?'Plan aanpassen':e.decision==='coach'?'Coachbespreking':'Huidige fase voortzetten'}</h3><p>${e.wins||'Geen toelichting'}${e.attention?' · Aandacht: '+e.attention:''}</p></article>`).join(''):'<p>Nog geen eerdere evaluaties.</p>'}save.onclick=()=>{const e={id:'ev-'+Date.now(),createdAt:new Date().toISOString(),period:+period.value,feeling:feeling.value,wins:wins.value.trim(),attention:attention.value.trim(),decision:decision.value,healthScore:snap.total,carePath:cp.path,careProgress:done.length?Math.round(done.filter(Boolean).length/done.length*100):null,coachStatus:'pending'};const h=P.read('zinergi-evaluations-v01',[]);h.push(e);P.write('zinergi-evaluations-v01',h);let c=P.read('zinergi-carepath-v01',{});c.lastEvaluationAt=e.createdAt;c.evaluationStatus='pending';if(e.decision==='next'&&Array.isArray(c.done)){const i=c.done.findIndex(x=>!x);if(i>=0)c.done[i]=true;c.phaseTransitionAt=e.createdAt}P.write('zinergi-carepath-v01',c);P.write('zinergi-evaluation-review',{status:'pending',evaluationId:e.id,submittedAt:e.createdAt,clientName:session.name,decision:e.decision});P.log('evaluation','Evaluatie opgeslagen');wins.value='';attention.value='';renderHistory();alert('Evaluatie opgeslagen en klaargezet voor Coach Review.')}renderHistory();</script><script src="/assets/zinergi-premium.js"></script><script src="/assets/zinergi-japandi-symbols.js"></script></body></html>
