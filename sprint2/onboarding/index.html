let lang=localStorage.getItem('zh_lang')||'nl',step=0;const data={};
const opts={goals:['Meer energie|More energy|Lebih berenergi','Sterker worden|Build strength|Menjadi lebih kuat','Darmgezondheid|Gut health|Kesehatan pencernaan','Hormoonbalans|Hormonal balance|Keseimbangan hormon','Afvallen|Lose weight|Menurunkan berat badan','Spiermassa|Muscle mass|Massa otot'],focus:['Darmen|Gut health|Pencernaan','Hormonen|Hormones|Hormon','Energie|Energy|Energi','Slaap|Sleep|Tidur','Stress|Stress|Stres','Kracht|Strength|Kekuatan'],gut:['Opgeblazen gevoel|Bloating|Kembung','Buikpijn|Abdominal pain|Nyeri perut','Onregelmatige ontlasting|Irregular bowel movements|BAB tidak teratur','Reflux|Reflux|Refluks','Geen klachten|No symptoms|Tidak ada keluhan'],hormone:['Regelmatige cyclus|Regular cycle|Siklus teratur','Perimenopauze|Perimenopause|Perimenopause','Menopauze|Menopause|Menopause','Postmenopauze|Postmenopause|Postmenopause','Niet van toepassing|Not applicable|Tidak berlaku'],frequency:['Nog niet|Not currently|Belum','1 keer per week|Once a week|1 kali per minggu','2–3 keer per week|2–3 times a week|2–3 kali per minggu','4+ keer per week|4+ times a week|4+ kali per minggu'],level:['Beginner|Beginner|Pemula','Gemiddeld|Intermediate|Menengah','Gevorderd|Advanced|Lanjutan'],place:['Thuis|At home|Di rumah','Sportschool|Gym|Gym','Buiten|Outdoors|Di luar'],equipment:['Geen materiaal|No equipment|Tanpa alat','Weerstandsband|Resistance band|Resistance band','Dumbbells|Dumbbells|Dumbbell','Kettlebell|Kettlebell|Kettlebell','Mat|Mat|Matras'],duration:['10–15 minuten|10–15 minutes|10–15 menit','20–30 minuten|20–30 minutes|20–30 menit','30–45 minuten|30–45 minutes|30–45 menit','45+ minuten|45+ minutes|45+ menit'],days:['Ma|Mon|Sen','Di|Tue|Sel','Wo|Wed|Rab','Do|Thu|Kam','Vr|Fri|Jum','Za|Sat|Sab','Zo|Sun|Min'],diet:['Alleseter|Omnivore|Omnivora','Vegetarisch|Vegetarian|Vegetarian','Vegan|Vegan|Vegan','Glutenvrij|Gluten-free|Bebas gluten','Lactosevrij|Lactose-free|Bebas laktosa'],allergy:['Geen|None|Tidak ada','Noten|Nuts|Kacang','Gluten|Gluten|Gluten','Lactose|Lactose|Laktosa','Vis/schaaldieren|Fish/shellfish|Ikan/seafood','Ei|Egg|Telur'],tracking:['Eiwitten|Protein|Protein','Vezels|Fibre|Serat','Water|Water|Air','Plant points|Plant points|Plant points','Training|Training|Latihan','Slaap|Sleep|Tidur','Stress|Stress|Stres','Supplementen|Supplements|Suplemen'],notifications:['Voeding|Nutrition|Nutrisi','Training|Training|Latihan','Water|Water|Air','Supplementen|Supplements|Suplemen','Nieuwe content|New content|Konten baru']};
function trOpt(x){return x.split('|')[lang==='nl'?0:lang==='en'?1:2]}
function choiceGrid(key,multi=true){return `<div class="choices">${opts[key].map((o,i)=>`<button class="choice ${(data[key]||[]).includes(i)?'selected':''}" onclick="pick('${key}',${i},${multi})"><b>${trOpt(o)}</b></button>`).join('')}</div>`}
function pick(k,i,m){if(m){data[k]=data[k]||[];data[k]=data[k].includes(i)?data[k].filter(x=>x!==i):[...data[k],i]}else data[k]=[i];render()}
function slider(key,min,max,val){const v=data[key]??val;return `<div class="slider"><div class="value">${v}/10</div><input type="range" min="${min}" max="${max}" value="${v}" oninput="data['${key}']=+this.value;this.previousElementSibling.textContent=this.value+'/10'"></div>`}
function form(type){switch(type){case'welcome':return `<div class="note">Deze onboarding is een interactieve UX/UI-test. Er worden nog geen echte medische dossiers of accounts aangemaakt.</div>`;case'account':return `<label>Naam</label><input value="${data.name||''}" oninput="data.name=this.value" placeholder="Mieke Dams"><label>E-mail</label><input type="email" value="${data.email||''}" oninput="data.email=this.value" placeholder="mieke@voorbeeld.nl"><label>Wachtwoord</label><input type="password" placeholder="Minimaal 8 tekens">`;case'language':return choiceGrid('language',false).replace('undefined','')||`<div class="choices"><button class="choice" onclick="setLang('nl')"><b>Nederlands</b></button><button class="choice" onclick="setLang('en')"><b>English</b></button><button class="choice" onclick="setLang('id')"><b>Bahasa Indonesia</b></button></div>`;case'country':return `<label>Land</label><select onchange="data.country=this.value"><option>Nederland</option><option>België</option><option>Indonesia</option><option>United Kingdom</option><option>Other</option></select>`;case'personal':return `<div class="inline"><div><label>Geboortedatum</label><input type="date" onchange="data.birth=this.value"></div><div><label>Geslacht</label><select onchange="data.gender=this.value"><option>Vrouw</option><option>Man</option><option>Anders</option></select></div></div><div class="inline"><div><label>Lengte (cm)</label><input type="number" value="${data.height||165}" oninput="data.height=this.value"></div><div><label>Gewicht (kg)</label><input type="number" value="${data.weight||70}" oninput="data.weight=this.value"></div></div>`;case'goals':case'focus':case'gut':case'hormone':case'frequency':case'level':case'place':case'equipment':case'duration':case'days':case'diet':case'allergy':case'tracking':case'notifications':return choiceGrid(type,!['focus','hormone','frequency','level','duration','diet'].includes(type));case'energy':case'sleep':case'stress':return slider(type,1,10,type==='stress'?5:6);case'meals':return `<div class="choices">${[2,3,4,5].map(n=>`<button class="choice ${data.meals===n?'selected':''}" onclick="data.meals=${n};render()"><b>${n}</b><small>maaltijden per dag</small></button>`).join('')}</div>`;case'review':return `<div class="summary"><div class="sum"><small>Naam</small><strong>${data.name||'Mieke'}</strong></div><div class="sum"><small>Doelen</small><strong>${(data.goals||[]).length||3} gekozen</strong></div><div class="sum"><small>Training</small><strong>${data.duration?trOpt(opts.duration[data.duration[0]]):'20–30 min'}</strong></div><div class="sum"><small>Maaltijden</small><strong>${data.meals||3} per dag</strong></div></div><div class="note">Je kunt alle keuzes later in je profiel aanpassen.</div>`;case'success':return `<div class="success"><div class="mark">✓</div><div class="plan"><h3>Zinergi Startplan</h3><ul><li>3 krachttrainingen per week</li><li>120 g eiwit en 35 g vezels per dag</li><li>30 plant points per week</li><li>Dagelijkse herstelcheck</li></ul></div></div>`;default:return ''}}
function render(){const s=T[lang].screens[step];document.documentElement.lang=lang;document.getElementById('stage').innerHTML=`<div class="eyebrow">Sprint 2 · Onboarding</div><h2>${s[0]}</h2><p class="lead">${s[1]}</p>${form(s[2])}`;document.getElementById('stepText').textContent=`${T[lang].step} ${step+1} ${T[lang].of} 25`;document.getElementById('barFill').style.width=((step+1)/25*100)+'%';document.getElementById('back').textContent=T[lang].back;document.getElementById('next').textContent=step===24?T[lang].finish:T[lang].next;document.getElementById('back').disabled=step===0;document.querySelectorAll('.langs button').forEach(b=>b.classList.toggle('active',b.dataset.lang===lang));}
function setLang(l){lang=l;localStorage.setItem('zh_lang',l);render()}
document.querySelectorAll('.langs button').forEach(b=>b.onclick=()=>setLang(b.dataset.lang));document.getElementById('back').onclick=()=>{if(step>0){step--;render();scrollTo(0,0)}};document.getElementById('next').onclick=()=>{if(step<24){step++;render();scrollTo(0,0)}else location.href='../../stap2/'};render();
</script></body></html>
